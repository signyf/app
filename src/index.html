<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>天气小挂件</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="edge-ball" class="edge-ball" type="button" aria-label="展开天气">
    <span id="ball-mark" class="ball-mark" data-mark="cloud" aria-hidden="true">
      <svg class="mark mark-sun" viewBox="0 0 16 16" width="16" height="16">
        <circle cx="8" cy="8" r="2.7" fill="currentColor" />
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.1 3.1l1.2 1.2M11.7 11.7l1.2 1.2M12.9 3.1l-1.2 1.2M4.3 11.7l-1.2 1.2" />
        </g>
      </svg>
      <svg class="mark mark-cloud" viewBox="0 0 16 16" width="16" height="16">
        <path fill="currentColor" d="M6.1 12.6h5a2.55 2.55 0 0 0 .35-5.08 3.35 3.35 0 0 0-6.45.95 2.15 2.15 0 0 0 1.1 4.13z" />
      </svg>
      <svg class="mark mark-rain" viewBox="0 0 16 16" width="16" height="16">
        <path fill="currentColor" d="M6 8.4h5.1a2.25 2.25 0 0 0 .25-4.48A2.95 2.95 0 0 0 5.7 4.7 1.95 1.95 0 0 0 6 8.4z" />
        <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M6.3 10.1v2.3M9.7 10.1v2.3" />
      </svg>
      <svg class="mark mark-snow" viewBox="0 0 16 16" width="16" height="16">
        <path fill="currentColor" d="M6 8.4h5.1a2.25 2.25 0 0 0 .25-4.48A2.95 2.95 0 0 0 5.7 4.7 1.95 1.95 0 0 0 6 8.4z" />
        <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M6.2 10.3l.7 1.3M9.8 10.3l-.7 1.3M8 10v1.8" />
      </svg>
      <svg class="mark mark-fog" viewBox="0 0 16 16" width="16" height="16">
        <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M3 6.2h10M2.4 8.8h11.2M3.4 11.4h9.2" />
      </svg>
    </span>
    <span id="ball-temp">--</span>
  </button>
  <main class="widget">
    <header class="chrome">
      <button id="search-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="search-surface">搜索</button>
      <div class="place">
        <div id="place-name" class="place-name">未选择地点</div>
        <div id="place-detail" class="place-detail"></div>
      </div>
      <button id="settings-toggle" class="icon-button" type="button" aria-label="设置" aria-expanded="false" aria-controls="settings-surface">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M7.1 1.2h1.8l.3 1.7c.4.1.7.3 1 .5l1.6-.7 1.3 1.3-.7 1.6c.2.3.4.6.5 1l1.7.3v1.8l-1.7.3c-.1.4-.3.7-.5 1l.7 1.6-1.3 1.3-1.6-.7c-.3.2-.6.4-1 .5l-.3 1.7H7.1l-.3-1.7c-.4-.1-.7-.3-1-.5l-1.6.7-1.3-1.3.7-1.6c-.2-.3-.4-.6-.5-1L1.4 8.8V7l1.7-.3c.1-.4.3-.7.5-1L2.9 4.1 4.2 2.8l1.6.7c.3-.2.6-.4 1-.5l.3-1.8zM8 10.2A2.2 2.2 0 1 0 8 5.8a2.2 2.2 0 0 0 0 4.4z" />
        </svg>
      </button>
      <button id="close-button" class="close-button" type="button" aria-label="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
          <path d="M2.2 2.2 L9.8 9.8 M9.8 2.2 L2.2 9.8" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div class="body">
      <section class="weather" aria-live="polite">
        <p id="weather-empty" class="weather-empty">选择地点</p>
        <div id="weather-skeleton" class="skeleton" hidden>
          <div class="sk sk-temp"></div>
          <div class="sk sk-line"></div>
          <div class="sk sk-line sk-mid"></div>
        </div>
        <div id="weather-data" class="weather-data" hidden>
          <div class="temp">
            <span id="temp-value" class="temp-value">--</span>
            <span class="unit">℃</span>
          </div>
          <p id="condition" class="quiet condition">--</p>
          <p id="stale-tag" class="quiet stale" hidden>上次数据</p>
          <p class="metrics quiet">
            <span id="humidity">湿度 --</span>
            <span id="uv">紫外线 --</span>
          </p>
          <p id="clothing" class="clothing" hidden></p>
          <p id="outdoor" class="clothing"></p>
          <p id="humidity-advice" class="clothing"></p>
        </div>
      </section>

      <section class="almanac" aria-label="黄历">
        <p class="date-row"><span class="date-label">新历</span><span id="gregorian"></span></p>
        <p class="date-row"><span class="date-label">农历</span><span id="lunar"></span></p>
        <div class="yiji">
          <p class="yiji-row"><span class="mark mark-yi">宜</span><span id="yi"></span></p>
          <p class="yiji-row"><span class="mark mark-ji">忌</span><span id="ji"></span></p>
        </div>
        <p id="festivals" class="festivals"></p>
      </section>

      <p id="status" class="status" role="status"></p>
      <p class="credits">地点 © OpenStreetMap · 天气 Open-Meteo</p>

      <div id="settings-surface" class="search-surface" role="dialog" aria-label="高德 Key" aria-hidden="true" inert>
        <p class="settings-title">高德 Web 服务 Key</p>
        <form id="settings-form" class="search-form">
          <input id="amap-key-input" type="text" maxlength="200" placeholder="粘贴 Web 服务 Key" autocomplete="off" spellcheck="false" aria-label="高德 Web 服务 Key" />
          <button id="settings-save" class="text-button search-submit" type="submit">保存</button>
        </form>
        <p id="settings-message" class="search-message" role="status"></p>
        <p class="settings-hint">保存后，搜索街道和门牌会用这把 Key。它只写在这台电脑的应用数据里。</p>
        <button id="settings-clear" class="text-button" type="button">清除</button>
        <label class="launch-row" for="launch-toggle">
          <span>开机启动</span>
          <input id="launch-toggle" type="checkbox" />
        </label>
        <p class="settings-hint">默认关闭。打开后，登录 Windows 时启动这个挂件。</p>
      </div>

      <div id="search-surface" class="search-surface" role="dialog" aria-label="搜索地点" aria-hidden="true" inert>
        <form id="search-form" class="search-form">
          <input id="search-input" type="text" maxlength="80" placeholder="城市或小区" aria-label="地点关键词" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" />
          <button id="search-button" class="text-button search-submit" type="submit">搜索</button>
        </form>
        <p id="selected-place" class="selected-place" hidden>
          <span class="selected-label">已选</span>
          <span class="selected-copy">
            <span id="selected-place-name" class="selected-name"></span>
            <span id="selected-place-detail" class="selected-detail"></span>
          </span>
        </p>
        <p id="search-message" class="search-message" role="status"></p>
        <div id="search-results" class="results" role="listbox" aria-label="地点结果"></div>
      </div>
    </div>
  </main>
  <script src="../dist/renderer.js"></script>
</body>
</html>
